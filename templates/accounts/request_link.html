{% extends "base.html" %}
{% block content %}
<h1>Log in or sign up</h1>
{% if turnstile_error %}
  <p class="note" role="alert">Please confirm you're a person and try again.</p>
{% endif %}
<form method="post" class="stacked-form">
  {% csrf_token %}
  {{ form.as_p }}
  {% include "core/_turnstile.html" with turnstile_site_key=turnstile_site_key %}
  <button type="submit">Send me a link</button>
</form>
{% endblock %}
