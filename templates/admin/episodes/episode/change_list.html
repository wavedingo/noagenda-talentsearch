{% extends "admin/change_list.html" %}
{% block object-tools-items %}
  {# POST, not a link: a sync is a write, and admin pages get prefetched. #}
  <li>
    <form method="post" action="{% url 'admin:episodes_episode_resync' %}" style="display:inline">
      {% csrf_token %}
      <button type="submit" class="button" style="padding:3px 12px">Re-sync feed now</button>
    </form>
  </li>
  {{ block.super }}
{% endblock %}
