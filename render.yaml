# NOT the source of truth for what is currently deployed. The live web service
# and Postgres were created by hand in the Render dashboard, not from this
# Blueprint, so nothing here has ever been applied: env var changes made in this
# file do not reach production, and the cron jobs below do not exist yet -- they
# have to be created in the dashboard too. Names here match the real service and
# database so the two stop contradicting each other, but adopting the Blueprint
# is an open decision (see spec Appendix A.3): it may create duplicates rather
# than take over the running service, which would mean moving the custom domain
# and reissuing its certificate.
services:
  - type: web
    name: noagenda-talentsearch
    runtime: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /healthz
    preDeployCommand: python manage.py migrate --noinput && python manage.py collectstatic --noinput
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: noagendatalentsearch-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: APP_ENV
        value: production
      - key: APP_URL
        value: https://noagendatalentsearch.com
      # www is redirected to the apex at Render's edge, so Django should never
      # see it -- listed anyway so a bypassed redirect serves the site instead
      # of a bare 400.
      - key: ALLOWED_HOSTS
        value: noagendatalentsearch.com,www.noagendatalentsearch.com
      - key: MAIL_FROM
        value: "No Agenda Talent Search <hello@noagendatalentsearch.com>"
      - key: RESEND_API_KEY
        sync: false
      - key: RSS_FEED_URL
        value: https://feeds.noagendaassets.com/noagenda.xml
      # Object storage (spec A.4). Until all five are set the app falls back to
      # local disk, which on Render means uploads vanish on the next deploy --
      # so these are the variables to set before opening auditions.
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET
        value: nats-media
      - key: R2_PUBLIC_BASE_URL
        value: https://media.noagendatalentsearch.com

  - type: cron
    name: rss-sync
    runtime: docker
    dockerfilePath: ./Dockerfile
    schedule: "*/30 * * * *"
    dockerCommand: python manage.py rss_sync
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: noagendatalentsearch-db
          property: connectionString
      - key: SECRET_KEY
        fromService:
          name: noagenda-talentsearch
          type: web
          envVarKey: SECRET_KEY
      - key: APP_ENV
        value: production
      - key: RSS_FEED_URL
        value: https://feeds.noagendaassets.com/noagenda.xml

  # Demos normally transcode in a background thread the moment they're uploaded.
  # This is the backstop: it requeues anything a deploy or crash abandoned
  # mid-transcode and drains whatever is waiting. Quarter-hourly rather than
  # per-minute because nothing routine depends on it -- a demo waits on a human
  # moderator anyway, and each cron run is a billed container start.
  - type: cron
    name: process-demos
    runtime: docker
    dockerfilePath: ./Dockerfile
    schedule: "*/15 * * * *"
    dockerCommand: python manage.py process_demos
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: noagendatalentsearch-db
          property: connectionString
      - key: SECRET_KEY
        fromService:
          name: noagenda-talentsearch
          type: web
          envVarKey: SECRET_KEY
      - key: APP_ENV
        value: production
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET
        value: nats-media
      - key: R2_PUBLIC_BASE_URL
        value: https://media.noagendatalentsearch.com

  - type: cron
    name: admin-digest
    runtime: docker
    dockerfilePath: ./Dockerfile
    schedule: "0 13 * * *"
    dockerCommand: python manage.py send_admin_digest
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: noagendatalentsearch-db
          property: connectionString
      - key: SECRET_KEY
        fromService:
          name: noagenda-talentsearch
          type: web
          envVarKey: SECRET_KEY
      - key: APP_ENV
        value: production
      - key: MAIL_FROM
        value: "No Agenda Talent Search <hello@noagendatalentsearch.com>"
      - key: ADMIN_NOTIFY_EMAIL
        sync: false
      - key: RESEND_API_KEY
        sync: false

  - type: cron
    name: weekly-backup
    runtime: docker
    dockerfilePath: ./Dockerfile
    schedule: "0 6 * * 0"
    dockerCommand: python manage.py backup_database
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: noagendatalentsearch-db
          property: connectionString
      - key: SECRET_KEY
        fromService:
          name: noagenda-talentsearch
          type: web
          envVarKey: SECRET_KEY
      - key: APP_ENV
        value: production
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET
        value: nats-media
      - key: R2_PUBLIC_BASE_URL
        value: https://media.noagendatalentsearch.com

  - type: cron
    name: recompute-scores
    runtime: docker
    dockerfilePath: ./Dockerfile
    schedule: "0 * * * *"
    dockerCommand: python manage.py recompute_scores
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: noagendatalentsearch-db
          property: connectionString
      - key: SECRET_KEY
        fromService:
          name: noagenda-talentsearch
          type: web
          envVarKey: SECRET_KEY
      - key: APP_ENV
        value: production

databases:
  - name: noagendatalentsearch-db
    plan: starter
